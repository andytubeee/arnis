plugins {
	id 'fabric-loom' version "${loom_version}"
}

repositories {
	maven { url = 'https://jm.gserv.me/repository/maven-public/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Only its API: JourneyMap itself is in the modpack, and the mod works without it.
	modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
test { useJUnitPlatform() }

// The Prism-importable pack: JourneyMap and Fabric API by download, this mod bundled.
tasks.register('mrpack', Zip) {
	dependsOn remapJar
	archiveFileName = 'arnis-map.mrpack'
	destinationDirectory = layout.buildDirectory.dir('modpack')
	from('modpack/modrinth.index.json')
	from(remapJar.archiveFile) { into 'overrides/mods' }
}
