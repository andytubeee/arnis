name: Fork Linux build

# The fork's releases are built by hand on a Mac; this builds the Linux files for them.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04  # Oldest supported base for AppImage glibc/WebKitGTK compatibility
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-arnis-linux
      with:
        rust-targets: x86_64-unknown-linux-gnu
        cache: "false"

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0" --locked

    - name: Build with AppImage bundle
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1  # Avoids FUSE requirement on CI runners
      run: cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage

    - name: Package
      run: |
        mkdir -p target/release
        mv target/x86_64-unknown-linux-gnu/release/arnis target/release/arnis-linux
        chmod +x target/release/arnis-linux
        tar -czf target/release/arnis-linux.tar.gz -C target/release arnis-linux
        mv target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage target/release/arnis-linux.AppImage
        chmod +x target/release/arnis-linux.AppImage
        tar -czf target/release/arnis-linux-appimage.tar.gz -C target/release arnis-linux.AppImage

    - uses: actions/upload-artifact@v7
      with:
        name: arnis-linux
        path: |
          target/release/arnis-linux.tar.gz
          target/release/arnis-linux-appimage.tar.gz
